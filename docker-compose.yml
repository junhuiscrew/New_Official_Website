name: junhui-global-website

services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-junhui}
      POSTGRES_USER: ${POSTGRES_USER:-junhui}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-junhui-local-dev}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:8.2-alpine
    ports:
      - '6379:6379'
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-junhui-local-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-junhui-minio-local-dev}
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-junhui-local-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-junhui-minio-local-dev}
    entrypoint: >-
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD;
      mc mb --ignore-existing local/public-media;
      mc mb --ignore-existing local/private-rfq;
      mc anonymous set download local/public-media;
      mc anonymous set none local/private-rfq;
      "
    restart: 'no'

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      APP_ENV: development
      APP_NAME: Junhui Global Website API
      APP_VERSION: 0.1.0
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-junhui}:${POSTGRES_PASSWORD:-junhui-local-dev}@postgres:5432/${POSTGRES_DB:-junhui}
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-junhui-local-admin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-junhui-minio-local-dev}
      MINIO_SECURE: 'false'
      MINIO_PUBLIC_BUCKET: public-media
      MINIO_PRIVATE_BUCKET: private-rfq
    command: >-
      sh -c "alembic upgrade head && python -m app.cli seed &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - '${API_HOST_PORT:-8010}:8000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=3)",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  website:
    build:
      context: .
      dockerfile: apps/website/Dockerfile
    environment:
      NUXT_PUBLIC_SITE_URL: https://junhuiscrewbarrel.com
      NUXT_PUBLIC_API_BASE: http://localhost:${API_HOST_PORT:-8010}/api/v1
    ports:
      - '3000:3000'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/zh-cn/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    environment:
      NUXT_PUBLIC_API_BASE: http://localhost:${API_HOST_PORT:-8010}/api/v1
    ports:
      - '3001:3001'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3001/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  nginx:
    image: nginx:1.28-alpine
    ports:
      - '8080:80'
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      website:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1/zh-cn/']
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres_data:
  redis_data:
  minio_data:
