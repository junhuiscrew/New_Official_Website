# Phase 3.1 本地反向代理：公开站点与 API，共享域名路由仅用于开发验证。
events {}

http {
    # 使用 Docker 内置 DNS 动态解析，避免应用容器重建后缓存旧 IP。
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;
        server_name _;

        location /api/ {
            set $api_upstream http://api:8000;
            proxy_pass $api_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 根级发现文件由 FastAPI 的统一发布/索引源生成，不能落到 Nuxt 404。
        location ~ ^/(sitemap\.xml|robots\.txt|llms\.txt)$ {
            set $api_upstream http://api:8000;
            proxy_pass $api_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            set $website_upstream http://website:3000;
            proxy_pass $website_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
