# Phase 3.7 试点：仅用于隔离本机 HTTPS，全部业务入口受 Basic Auth 与 noindex 保护。
events {}

http {
    resolver 127.0.0.11 valid=10s ipv6=off;
    client_max_body_size 110m;

    # 三个本地域名共用私有 CA 签发的 SAN 证书，证书与 htpasswd 不进入 Git。
    ssl_certificate /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    server {
        listen 443 ssl default_server;
        server_name junhui.test;

        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        auth_basic "Junhui Phase 3.7 Pilot";
        auth_basic_user_file /etc/nginx/phase37.htpasswd;

        location = /healthz {
            auth_basic off;
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
            add_header X-Robots-Tag "noindex, nofollow" always;
        }

        location /api/ {
            set $api_upstream http://api:8000;
            proxy_pass $api_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
        }

        location / {
            set $website_upstream http://website:3000;
            proxy_pass $website_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
        }
    }

    server {
        listen 443 ssl;
        server_name admin.junhui.test;

        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        auth_basic "Junhui Phase 3.7 Pilot";
        auth_basic_user_file /etc/nginx/phase37.htpasswd;

        location /api/ {
            set $api_upstream http://api:8000;
            proxy_pass $api_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
        }

        location / {
            set $admin_upstream http://admin:3001;
            proxy_pass $admin_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
        }
    }

    server {
        listen 443 ssl;
        server_name api.junhui.test;

        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        auth_basic "Junhui Phase 3.7 Pilot";
        auth_basic_user_file /etc/nginx/phase37.htpasswd;

        location / {
            set $api_upstream http://api:8000;
            proxy_pass $api_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}

