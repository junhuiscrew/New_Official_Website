# 仅供本机真实域名预览使用；必须和 phase37/runtime 覆盖一起启用。
services:
  api:
    environment:
      CORS_ALLOWED_ORIGINS: '["https://junhuiscrewbarrel.com","https://www.junhuiscrewbarrel.com","https://admin.junhuiscrewbarrel.com","https://api.junhuiscrewbarrel.com"]'
      MINIO_PUBLIC_ENDPOINT: api.junhuiscrewbarrel.com

  worker:
    environment:
      CORS_ALLOWED_ORIGINS: '["https://junhuiscrewbarrel.com","https://www.junhuiscrewbarrel.com","https://admin.junhuiscrewbarrel.com","https://api.junhuiscrewbarrel.com"]'
      MINIO_PUBLIC_ENDPOINT: api.junhuiscrewbarrel.com

  nginx:
    networks:
      default:
        aliases:
          - junhuiscrewbarrel.com
          - www.junhuiscrewbarrel.com
          - admin.junhuiscrewbarrel.com
          - api.junhuiscrewbarrel.com
    ports: !override
      - '127.0.0.1:443:443'
    volumes: !override
      - ./infra/nginx/nginx.local-domain.conf:/etc/nginx/nginx.conf:ro
      - ./data/phase3-7/tls/local-domain.crt:/etc/nginx/tls/local-domain.crt:ro
      - ./data/phase3-7/tls/local-domain.key:/etc/nginx/tls/local-domain.key:ro
    healthcheck:
      test:
        - CMD
        - wget
        - --no-check-certificate
        - -q
        - --spider
        - https://127.0.0.1/healthz
