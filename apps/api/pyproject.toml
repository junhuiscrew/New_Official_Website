[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "junhui-global-api"
version = "0.1.0"
description = "Junhui Global Website modular monolith API"
requires-python = ">=3.12,<3.14"
dependencies = [
    "alembic==1.16.5",
    "argon2-cffi==25.1.0",
    "asyncpg==0.30.0",
    "celery[redis]==5.5.3",
    "fastapi==0.116.1",
    "greenlet==3.2.4",
    "email-validator==2.3.0",
    "PyJWT==2.10.1",
    "minio==7.2.15",
    "pillow==11.3.0",
    "pydantic-settings==2.10.1",
    "python-multipart==0.0.20",
    "redis==5.2.1",
    "sqlalchemy[asyncio]==2.0.43",
    "uvicorn[standard]==0.35.0",
]

[project.optional-dependencies]
test = [
    "aiosqlite==0.21.0",
    "httpx==0.28.1",
    "pytest==8.4.2",
    "pytest-asyncio==1.1.0",
]
dev = [
    "junhui-global-api[test]",
    "ruff==0.12.11",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-ra --basetemp=.pytest-tmp"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "postgresql: requires TEST_DATABASE_URL pointing to PostgreSQL",
    "minio: requires TEST_MINIO_REAL=1 and a real MinIO endpoint",
    "redis: requires TEST_REDIS_REAL=1 and a real Redis endpoint",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    # Ruff formatter intentionally does not rewrite every long string/comment.
    "E501",
    # FastAPI's dependency injection convention requires Depends() defaults.
    "B008",
]
