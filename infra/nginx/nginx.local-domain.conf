# 本机真实域名预览：宿主端口必须由 Compose 绑定到 127.0.0.1。
events {}

http {
    resolver 127.0.0.11 valid=10s ipv6=off;
    client_max_body_size 110m;

    ssl_certificate /etc/nginx/tls/local-domain.crt;
    ssl_certificate_key /etc/nginx/tls/local-domain.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # 未知 Host/SNI 不允许读取站点。healthz 只供本机容器健康检查。
    server {
        listen 443 ssl default_server;
        server_name _;

        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Junhui-Local-Preview "loopback-only" always;

        location = /healthz {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
            add_header X-Robots-Tag "noindex, nofollow" always;
            add_header X-Junhui-Local-Preview "loopback-only" always;
        }

        location / {
            return 444;
        }
    }

    # www 仅作为本机别名，统一跳转到正式规范裸域。
    server {
        listen 443 ssl;
        server_name www.junhuiscrewbarrel.com;

        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Junhui-Local-Preview "loopback-only" always;
        return 308 https://junhuiscrewbarrel.com$request_uri;
    }

    # 本机前台：取消 Nginx Basic Auth，但保留应用层 API 权限。
    server {
        listen 443 ssl;
        server_name junhuiscrewbarrel.com;

        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Junhui-Local-Preview "loopback-only" always;

        location /api/ {
            set $api_upstream http://api:8000;
            proxy_pass $api_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
        }

        location / {
            set $website_upstream http://website:3000;
            proxy_pass $website_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
        }
    }

    # Admin 壳免网关 Basic，应用登录、RBAC、Cookie 与 CSRF 保持原样。
    server {
        listen 443 ssl;
        server_name admin.junhuiscrewbarrel.com;

        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Junhui-Local-Preview "loopback-only" always;

        location /api/ {
            set $api_upstream http://api:8000;
            proxy_pass $api_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
        }

        # 预览运行在 Admin 域，使用独立前缀读取 Website 构建资源，避免与 Admin 的 /_nuxt 冲突。
        location ^~ /preview-assets/_nuxt/ {
            set $website_preview_upstream http://website:3000;
            rewrite ^/preview-assets(/_nuxt/.*)$ $1 break;
            proxy_pass $website_preview_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            add_header Cache-Control "private, no-store" always;
        }

        location ^~ /preview-assets/brand/ {
            set $website_preview_upstream http://website:3000;
            rewrite ^/preview-assets(/brand/.*)$ $1 break;
            proxy_pass $website_preview_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            add_header Cache-Control "private, no-store" always;
        }

        # 作者完整布局预览与 Admin 共享 Host-only 登录 Cookie，由 Website SSR 服务端校验权限。
        location ^~ /preview/ {
            set $website_preview_upstream http://website:3000;
            proxy_pass $website_preview_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Cookie $http_cookie;
            # 仅改写预览 HTML 的 Website 静态资源前缀；公开站和 Admin 自身路径保持不变。
            proxy_set_header Accept-Encoding "";
            sub_filter_once off;
            sub_filter '"/_nuxt/' '"/preview-assets/_nuxt/';
            sub_filter '"/brand/' '"/preview-assets/brand/';
            proxy_hide_header Cache-Control;
            add_header Cache-Control "private, no-store" always;
            add_header X-Robots-Tag "noindex, nofollow" always;
        }

        location / {
            set $admin_upstream http://admin:3001;
            proxy_pass $admin_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
        }
    }

    # 独立 API 域只暴露原 API；匿名管理和私有附件继续由应用权限拒绝。
    server {
        listen 443 ssl;
        server_name api.junhuiscrewbarrel.com;

        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Junhui-Local-Preview "loopback-only" always;

        location / {
            set $api_upstream http://api:8000;
            proxy_pass $api_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
