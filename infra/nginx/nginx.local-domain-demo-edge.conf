# 本机共享 TLS 入口：同时服务原 phase37 预览与独立 Demo R2，宿主端口由 Compose 绑定到 127.0.0.1。
events {}

http {
    resolver 127.0.0.11 valid=10s ipv6=off;
    client_max_body_size 110m;

    ssl_certificate /etc/nginx/tls/local-domain.crt;
    ssl_certificate_key /etc/nginx/tls/local-domain.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    server {
        listen 443 ssl default_server;
        server_name _;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Junhui-Local-Preview "loopback-only" always;
        location = /healthz { return 200 "healthy\n"; add_header Content-Type text/plain; }
        location / { return 444; }
    }

    server {
        listen 443 ssl;
        server_name www.junhuiscrewbarrel.com;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Junhui-Local-Preview "loopback-only" always;
        return 308 https://junhuiscrewbarrel.com$request_uri;
    }

    server {
        listen 443 ssl;
        server_name junhuiscrewbarrel.com;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Junhui-Local-Preview "loopback-only" always;
        location /api/ {
            set $api_upstream http://api:8000;
            proxy_pass $api_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
        }

        location / {
            set $website_upstream http://website:3000;
            proxy_pass $website_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
        }
    }

    server {
        listen 443 ssl;
        server_name admin.junhuiscrewbarrel.com;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Junhui-Local-Preview "loopback-only" always;
        location /api/ {
            set $api_upstream http://api:8000;
            proxy_pass $api_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
        }

        # 保留原 phase37 的作者完整布局预览，避免 Demo 入口影响既有验收环境。
        location ^~ /preview-assets/_nuxt/ {
            set $website_preview_upstream http://website:3000;
            rewrite ^/preview-assets(/_nuxt/.*)$ $1 break;
            proxy_pass $website_preview_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            add_header Cache-Control "private, no-store" always;
        }

        location ^~ /preview-assets/brand/ {
            set $website_preview_upstream http://website:3000;
            rewrite ^/preview-assets(/brand/.*)$ $1 break;
            proxy_pass $website_preview_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            add_header Cache-Control "private, no-store" always;
        }

        location ^~ /preview/ {
            set $website_preview_upstream http://website:3000;
            proxy_pass $website_preview_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Cookie $http_cookie;
            proxy_set_header Accept-Encoding "";
            sub_filter_once off;
            sub_filter '"/_nuxt/' '"/preview-assets/_nuxt/';
            sub_filter '"/brand/' '"/preview-assets/brand/';
            proxy_hide_header Cache-Control;
            add_header Cache-Control "private, no-store" always;
            add_header X-Robots-Tag "noindex, nofollow" always;
        }
        location / {
            set $admin_upstream http://admin:3001;
            proxy_pass $admin_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
        }
    }

    server {
        listen 443 ssl;
        server_name api.junhuiscrewbarrel.com;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Junhui-Local-Preview "loopback-only" always;
        location / {
            set $api_upstream http://api:8000;
            proxy_pass $api_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
        }
    }

    # Demo 前台：页面由 Website SSR 提供，同源 API 明确转发到独立 Demo API。
    server {
        listen 443 ssl;
        server_name demo.junhuiscrewbarrel.com;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "no-store" always;
        add_header X-Junhui-Local-Preview "demo-r2-loopback-only" always;
        add_header X-Junhui-Demo "JH-DEMO-R2-V1" always;
        location /api/ {
            set $demo_api_upstream http://demo-r2-api:8000;
            proxy_pass $demo_api_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
        }
        location / {
            set $demo_website_upstream http://demo-r2-website:3000;
            proxy_pass $demo_website_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
        }
    }

    # Demo Admin：保留应用自身登录、RBAC、Secure Cookie 和 CSRF。
    server {
        listen 443 ssl;
        server_name admin-demo.junhuiscrewbarrel.com;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "no-store" always;
        add_header X-Junhui-Local-Preview "demo-r2-loopback-only" always;
        add_header X-Junhui-Demo "JH-DEMO-R2-V1" always;
        location /api/ {
            set $demo_api_upstream http://demo-r2-api:8000;
            proxy_pass $demo_api_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
        }

        # Demo作者预览保持在Demo Admin同源，由Website SSR继续通过Demo API验证登录与content.read。
        location ^~ /preview-assets/_nuxt/ {
            set $demo_website_preview_upstream http://demo-r2-website:3000;
            rewrite ^/preview-assets(/_nuxt/.*)$ $1 break;
            proxy_pass $demo_website_preview_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            add_header Cache-Control "private, no-store" always;
        }

        location ^~ /preview-assets/brand/ {
            set $demo_website_preview_upstream http://demo-r2-website:3000;
            rewrite ^/preview-assets(/brand/.*)$ $1 break;
            proxy_pass $demo_website_preview_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            add_header Cache-Control "private, no-store" always;
        }

        location ^~ /preview/ {
            set $demo_website_preview_upstream http://demo-r2-website:3000;
            proxy_pass $demo_website_preview_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Cookie $http_cookie;
            proxy_set_header Accept-Encoding "";
            sub_filter_once off;
            sub_filter '"/_nuxt/' '"/preview-assets/_nuxt/';
            sub_filter '"/brand/' '"/preview-assets/brand/';
            proxy_hide_header Cache-Control;
            add_header Cache-Control "private, no-store" always;
            add_header X-Robots-Tag "noindex, nofollow" always;
        }

        location / {
            set $demo_admin_upstream http://demo-r2-admin:3001;
            proxy_pass $demo_admin_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
        }
    }

    # Demo API 独立域名；不会回退到原 phase37 API。
    server {
        listen 443 ssl;
        server_name api-demo.junhuiscrewbarrel.com;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Junhui-Local-Preview "demo-r2-loopback-only" always;
        add_header X-Junhui-Demo "JH-DEMO-R2-V1" always;
        location / {
            set $demo_api_upstream http://demo-r2-api:8000;
            proxy_pass $demo_api_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
