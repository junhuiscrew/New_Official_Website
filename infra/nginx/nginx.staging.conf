events {}

http {
    # Staging 使用 Docker DNS；所有用户页面统一由 Basic Auth 保护并拒绝索引。
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;
        server_name _;

        add_header X-Robots-Tag "noindex, nofollow" always;
        auth_basic "Junhui Staging";
        auth_basic_user_file /etc/nginx/staging.htpasswd;

        # 容器内部健康检查不暴露业务内容，因此不要求 Basic Auth。
        location = /healthz {
            auth_basic off;
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
            add_header X-Robots-Tag "noindex, nofollow" always;
        }

        location /api/ {
            set $api_upstream http://api:8000;
            proxy_pass $api_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Staging 仍由 API 生成发现文件，但响应保持全站 noindex。
        location ~ ^/(sitemap\.xml|robots\.txt|llms\.txt)$ {
            set $api_upstream http://api:8000;
            proxy_pass $api_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /admin/ {
            set $admin_upstream http://admin:3001;
            proxy_pass $admin_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            set $website_upstream http://website:3000;
            proxy_pass $website_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
