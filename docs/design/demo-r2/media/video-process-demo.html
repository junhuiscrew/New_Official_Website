<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Manufacturing review flow · DEMO</title>
    <style>
      /* 页面用途：用于生成制造检查流程演示视频，不代表真实产线或检测记录。 */
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: linear-gradient(135deg,#061b33,#0a3765); font-family: Arial, sans-serif; color: white; }
      body { display: grid; place-items: center; }
      .beam { position: absolute; width: 18px; height: 120%; background: linear-gradient(transparent,#5bb5ff,transparent); filter: blur(2px); animation: scan 3.4s ease-in-out infinite; }
      .panel { width: min(1040px,86vw); padding: 58px 64px; border: 1px solid rgba(130,195,255,.38); border-radius: 28px; background: rgba(2,20,40,.72); box-shadow: 0 30px 90px rgba(0,0,0,.38); backdrop-filter: blur(12px); }
      .title { display: flex; justify-content: space-between; align-items: end; }
      .title small { color: #74bcff; letter-spacing: .2em; font-weight: 700; }
      h1 { margin: 10px 0 34px; font-size: 46px; }
      .flow { display: grid; grid-template-columns: repeat(4,1fr); gap: 22px; }
      .step { position: relative; min-height: 180px; padding: 28px 24px; border-radius: 18px; background: linear-gradient(160deg,rgba(49,126,202,.55),rgba(7,34,62,.85)); border: 1px solid rgba(130,195,255,.3); animation: lift 4s ease-in-out infinite; }
      .step:nth-child(2) { animation-delay: .35s; }.step:nth-child(3) { animation-delay: .7s; }.step:nth-child(4) { animation-delay: 1.05s; }
      .num { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 50%; background: #2d91ef; font-weight: 800; box-shadow: 0 0 28px rgba(45,145,239,.55); }
      .step h2 { margin: 28px 0 8px; font-size: 22px; }.step p { margin: 0; color: #bdd7ef; line-height: 1.5; }
      .badge { position: absolute; top: 34px; right: 42px; padding: 11px 17px; border: 1px solid #5ea9f3; border-radius: 999px; background: rgba(3,27,56,.7); font-weight: 700; }
      @keyframes scan { 0%,100% { left: -5%; } 50% { left: 105%; } }
      @keyframes lift { 50% { transform: translateY(-14px); border-color: #71bcff; } }
    </style>
  </head>
  <body>
    <div class="beam"></div><div class="badge">DEMO · 演示素材</div>
    <section class="panel"><div class="title"><div><small>ILLUSTRATIVE WORKFLOW</small><h1>Manufacturing review flow</h1></div></div>
      <div class="flow">
        <article class="step"><div class="num">01</div><h2>需求澄清</h2><p>Requirement brief</p></article>
        <article class="step"><div class="num">02</div><h2>方案评审</h2><p>Engineering review</p></article>
        <article class="step"><div class="num">03</div><h2>过程检查</h2><p>Process inspection</p></article>
        <article class="step"><div class="num">04</div><h2>交付记录</h2><p>Delivery record</p></article>
      </div>
    </section>
  </body>
</html>
