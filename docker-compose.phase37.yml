name: junhui-phase37-pilot

services:
  postgres:
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Phase 3.7 database name is required}
      POSTGRES_USER: ${POSTGRES_USER:?Phase 3.7 database user is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Phase 3.7 database password is required}
    ports: !reset []

  redis:
    ports: !reset []

  minio:
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?Phase 3.7 MinIO access key is required}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?Phase 3.7 MinIO secret key is required}
    ports: !reset []

  minio-init:
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?Phase 3.7 MinIO access key is required}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?Phase 3.7 MinIO secret key is required}

  api:
    environment:
      APP_ENV: staging
      DATABASE_URL: ${DATABASE_URL:?Phase 3.7 DATABASE_URL is required}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Phase 3.7 CORS allowlist is required}
      JWT_SIGNING_SECRET: ${JWT_SIGNING_SECRET:?Phase 3.7 JWT secret is required}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:?Phase 3.7 refresh secret is required}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?Phase 3.7 MinIO access key is required}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?Phase 3.7 MinIO secret key is required}
      MINIO_ENDPOINT: minio:9000
      MINIO_PUBLIC_ENDPOINT: api.junhui.test
      MINIO_INTERNAL_SECURE: 'false'
      MINIO_PUBLIC_SECURE: 'true'
      AUTH_COOKIE_SECURE: 'true'
      AUTH_COOKIE_SAMESITE: lax
      PUBLIC_SITEMAP_ENABLED: 'false'
      LLMS_TXT_ENABLED: 'false'
      ANALYTICS_ENABLED: 'false'
      MARKETING_EMAIL_ENABLED: 'false'
      MALWARE_SCANNER_ENABLED: 'false'
      TRUSTED_PROXY_CIDRS: '["172.16.0.0/12"]'
    ports: !reset []

  worker:
    environment:
      APP_ENV: staging
      DATABASE_URL: ${DATABASE_URL:?Phase 3.7 DATABASE_URL is required}
      JWT_SIGNING_SECRET: ${JWT_SIGNING_SECRET:?Phase 3.7 JWT secret is required}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:?Phase 3.7 refresh secret is required}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?Phase 3.7 MinIO access key is required}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?Phase 3.7 MinIO secret key is required}
      MINIO_ENDPOINT: minio:9000
      MINIO_PUBLIC_ENDPOINT: api.junhui.test
      MINIO_INTERNAL_SECURE: 'false'
      MINIO_PUBLIC_SECURE: 'true'
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Phase 3.7 CORS allowlist is required}
      MALWARE_SCANNER_ENABLED: 'false'

  website:
    environment:
      NUXT_PUBLIC_SITE_URL: https://junhuiscrewbarrel.com
      NUXT_PUBLIC_API_BASE: /api/v1
      NUXT_API_INTERNAL_BASE: http://api:8000/api/v1
      NUXT_PUBLIC_SITEMAP_ENABLED: 'false'
      NUXT_PUBLIC_ANALYTICS_ENABLED: 'false'
    ports: !reset []

  admin:
    environment:
      NUXT_PUBLIC_API_BASE: /api/v1
      NUXT_API_INTERNAL_BASE: http://api:8000/api/v1
    ports: !reset []

  nginx:
    networks:
      default:
        aliases:
          - junhui.test
          - admin.junhui.test
          - api.junhui.test
    ports: !override
      - '443:443'
    volumes: !override
      - ./infra/nginx/nginx.phase37.conf:/etc/nginx/nginx.conf:ro
      - ./data/phase3-7/tls/server.crt:/etc/nginx/tls/server.crt:ro
      - ./data/phase3-7/tls/server.key:/etc/nginx/tls/server.key:ro
      - ./data/phase3-7/auth/phase37.htpasswd:/etc/nginx/phase37.htpasswd:ro
    depends_on:
      website:
        condition: service_healthy
      admin:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '--no-check-certificate', '-q', '--spider', 'https://127.0.0.1/healthz']
